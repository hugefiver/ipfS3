name: ipfs3-cluster

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/10-ipfs3.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipfs3 -d ipfs3"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kubo-a:
    build:
      context: ./ipfs
      dockerfile: cluster.Dockerfile
    image: ghcr.io/hugefiver/ipfs3-kubo-cluster:v0.43.0
    volumes:
      - kubo_a_data:/data/ipfs
    environment:
      IPFS_PATH: /data/ipfs
      IPFS_SWARM_KEY_FILE: /run/secrets/swarm_key
      LIBP2P_FORCE_PNET: "1"
    secrets:
      - source: swarm_key
        target: swarm_key
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  kubo-b:
    build:
      context: ./ipfs
      dockerfile: cluster.Dockerfile
    image: ghcr.io/hugefiver/ipfs3-kubo-cluster:v0.43.0
    volumes:
      - kubo_b_data:/data/ipfs
    environment:
      IPFS_PATH: /data/ipfs
      IPFS_SWARM_KEY_FILE: /run/secrets/swarm_key
      LIBP2P_FORCE_PNET: "1"
    secrets:
      - source: swarm_key
        target: swarm_key
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  swarm-bootstrap:
    image: ipfs/kubo:v0.43.0
    entrypoint:
      - /bin/sh
      - -ec
      - |
        fail() {
          printf '%s\n' 'private swarm bootstrap failed' >&2
          exit 1
        }

        ensure_peering() {
          api=$$1
          address=$$2
          expected_id=$$3
          expected_transport=$$4
          tab=$$(printf '\t')
          expected=$$(printf '%s\n%s' "$$expected_id" "$$tab$$expected_transport")
          peering=$$(ipfs --api "$$api" swarm peering ls 2>/dev/null) || return 1
          peering=$$(printf '%s\n' "$$peering" | sed '/^[[:space:]]*$$/d') || return 1
          if [ -z "$$peering" ]; then
            ipfs --api "$$api" swarm peering add "$$address" >/dev/null 2>&1 || return 1
            return 0
          fi
          [ "$$peering" = "$$expected" ]
        }

        peering_matches() {
          api=$$1
          expected_id=$$2
          expected_transport=$$3
          tab=$$(printf '\t')
          expected=$$(printf '%s\n%s' "$$expected_id" "$$tab$$expected_transport")
          peering=$$(ipfs --api "$$api" swarm peering ls 2>/dev/null) || return 1
          peering=$$(printf '%s\n' "$$peering" | sed '/^[[:space:]]*$$/d') || return 1
          [ "$$peering" = "$$expected" ]
        }

        sole_peer() {
          api=$$1
          expected_id=$$2
          peers=$$(ipfs --api "$$api" swarm peers 2>/dev/null) || return 1
          peers=$$(printf '%s\n' "$$peers" | sed '/^[[:space:]]*$$/d') || return 1
          [ -n "$$peers" ] || return 1
          peer_count=$$(printf '%s\n' "$$peers" | wc -l | tr -d '[:space:]') || return 1
          [ "$$peer_count" -eq 1 ] || return 1
          line=$$(printf '%s\n' "$$peers" | sed -n '1p') || return 1
          case "$$line" in
            */p2p/"$$expected_id") return 0 ;;
            *) return 1 ;;
          esac
        }

        attempt=1
        while [ "$$attempt" -le 60 ]; do
          kubo_a_id=$$(ipfs --api /dns4/kubo-a/tcp/5001 id -f '<id>' 2>/dev/null) || kubo_a_id=
          kubo_b_id=$$(ipfs --api /dns4/kubo-b/tcp/5001 id -f '<id>' 2>/dev/null) || kubo_b_id=
          if [ -n "$$kubo_a_id" ] && [ -n "$$kubo_b_id" ]; then
            if ensure_peering /dns4/kubo-a/tcp/5001 "/dns4/kubo-b/tcp/4001/p2p/$$kubo_b_id" "$$kubo_b_id" "/dns4/kubo-b/tcp/4001" && \
              ensure_peering /dns4/kubo-b/tcp/5001 "/dns4/kubo-a/tcp/4001/p2p/$$kubo_a_id" "$$kubo_a_id" "/dns4/kubo-a/tcp/4001"; then
              ipfs --api /dns4/kubo-a/tcp/5001 swarm connect "/dns4/kubo-b/tcp/4001/p2p/$$kubo_b_id" >/dev/null 2>&1 || :
              ipfs --api /dns4/kubo-b/tcp/5001 swarm connect "/dns4/kubo-a/tcp/4001/p2p/$$kubo_a_id" >/dev/null 2>&1 || :
              if peering_matches /dns4/kubo-a/tcp/5001 "$$kubo_b_id" "/dns4/kubo-b/tcp/4001" && \
                peering_matches /dns4/kubo-b/tcp/5001 "$$kubo_a_id" "/dns4/kubo-a/tcp/4001"; then
                if sole_peer /dns4/kubo-a/tcp/5001 "$$kubo_b_id" && \
                  sole_peer /dns4/kubo-b/tcp/5001 "$$kubo_a_id"; then
                  exit 0
                fi
              fi
            fi
          fi
          attempt=$$((attempt + 1))
          sleep 1
        done
        fail
    depends_on:
      kubo-a:
        condition: service_healthy
      kubo-b:
        condition: service_healthy
    restart: "no"

  cluster-a:
    image: ipfs/ipfs-cluster:v1.1.6@sha256:a83266c524f1c0bc81d14fe3c8b46c5b83a7b2d8432fb8a50300f27d3c863dcd
    environment:
      IPFS_CLUSTER_CONSENSUS: crdt
      CLUSTER_PEERNAME: cluster-a
      CLUSTER_SECRET: "${IPFS_S3_CLUSTER_SECRET:?IPFS_S3_CLUSTER_SECRET is required}"
      CLUSTER_CRDT_TRUSTEDPEERS: "*"
      CLUSTER_REPLICATIONFACTORMIN: "2"
      CLUSTER_REPLICATIONFACTORMAX: "2"
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/kubo-a/tcp/5001
      CLUSTER_IPFSPROXY_NODEMULTIADDRESS: /dns4/kubo-a/tcp/5001
      CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9094
      CLUSTER_IPFSPROXY_LISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9095
    volumes:
      - cluster_a_data:/data/ipfs-cluster
    depends_on:
      kubo-a:
        condition: service_healthy
      swarm-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ipfs-cluster-ctl", "id"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  cluster-b:
    image: ipfs/ipfs-cluster:v1.1.6@sha256:a83266c524f1c0bc81d14fe3c8b46c5b83a7b2d8432fb8a50300f27d3c863dcd
    environment:
      IPFS_CLUSTER_CONSENSUS: crdt
      CLUSTER_PEERNAME: cluster-b
      CLUSTER_SECRET: "${IPFS_S3_CLUSTER_SECRET:?IPFS_S3_CLUSTER_SECRET is required}"
      CLUSTER_CRDT_TRUSTEDPEERS: "*"
      CLUSTER_REPLICATIONFACTORMIN: "2"
      CLUSTER_REPLICATIONFACTORMAX: "2"
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/kubo-b/tcp/5001
      CLUSTER_IPFSPROXY_NODEMULTIADDRESS: /dns4/kubo-b/tcp/5001
      CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9094
      CLUSTER_IPFSPROXY_LISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9095
    volumes:
      - cluster_b_data:/data/ipfs-cluster
    depends_on:
      kubo-b:
        condition: service_healthy
      swarm-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ipfs-cluster-ctl", "id"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  gateway:
    build: .
    image: ghcr.io/hugefiver/ipfs3:latest
    ports:
      - "127.0.0.1:${IPFS_S3_GATEWAY_PORT:?IPFS_S3_GATEWAY_PORT is required}:9000"
    environment:
      IPFS_S3_BIND: 0.0.0.0:9000
      IPFS_S3_PUBLISHED_BIND: "${IPFS_S3_GATEWAY_BIND:?IPFS_S3_GATEWAY_BIND is required}"
      IPFS_S3_KUBO_RPC_URL: http://cluster-a:9095
      IPFS_S3_DATABASE_URL: "postgres://ipfs3:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ipfs3"
      IPFS_S3_ACCESS_KEY_ID: "${IPFS_S3_ACCESS_KEY_ID:?IPFS_S3_ACCESS_KEY_ID is required}"
      IPFS_S3_SECRET_ACCESS_KEY: "${IPFS_S3_SECRET_ACCESS_KEY:?IPFS_S3_SECRET_ACCESS_KEY is required}"
      IPFS_S3_MASTER_KEY: "${IPFS_S3_MASTER_KEY:?IPFS_S3_MASTER_KEY is required}"
      RUST_LOG: info
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${IPFS_S3_PUBLISHED_BIND}" in
          "127.0.0.1")
            ;;
          *)
            exit 64
            ;;
        esac
        exec /app/ipfs-s3-gateway
    depends_on:
      postgres:
        condition: service_healthy
      cluster-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/ipfs-s3-gateway", "--ready-probe"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  kubo_a_data:
  kubo_b_data:
  cluster_a_data:
  cluster_b_data:

configs:
  postgres_init:
    content: |
      \set app_password '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
      CREATE ROLE ipfs3 LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
      SELECT format('ALTER ROLE ipfs3 PASSWORD %L', :'app_password') \gexec
      CREATE DATABASE ipfs3 OWNER ipfs3;

secrets:
  swarm_key:
    file: "${IPFS_S3_SWARM_KEY_FILE:?IPFS_S3_SWARM_KEY_FILE is required}"
