name: Release validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IPFS_S3_TEST_POSTGRES_URL: postgres://ipfs3:ipfs3@127.0.0.1:5432/ipfs3_import_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ipfs3_import_test
          POSTGRES_USER: ipfs3
          POSTGRES_PASSWORD: ipfs3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipfs3 -d ipfs3_import_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run live PostgreSQL import tests
        run: cargo test --test postgres_import -- --nocapture --test-threads=1

  postgres-production-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_DISABLE_ENV_FILE: "1"
      COMPOSE_PROJECT_NAME: ipfs3-pg-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
      IPFS_S3_ACCESS_KEY_ID: test
      IPFS_S3_SECRET_ACCESS_KEY: test
      IPFS_S3_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      IPFS_S3_GATEWAY_BIND: 127.0.0.1
      IPFS_S3_GATEWAY_PORT: 59000
      IPFS_S3_E2E_ENDPOINT: http://127.0.0.1:59000
      IPFS_S3_E2E_KUBO_URL: http://127.0.0.1:55001
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Docker Compose
        shell: pwsh
        run: |
          docker compose version
          if ($LASTEXITCODE -ne 0) { throw "Docker Compose v2 is unavailable" }
          $composeVersionText = (docker compose version --short).Trim()
          $composeVersionMatch = [regex]::Match($composeVersionText, '^v?(?<core>\d+\.\d+\.\d+)(?:[-+][0-9A-Za-z.-]+)?$')
          $composeVersion = $null
          if (-not $composeVersionMatch.Success -or -not [Version]::TryParse($composeVersionMatch.Groups["core"].Value, [ref]$composeVersion) -or $composeVersion -lt [Version]"2.23.1") { throw "Docker Compose 2.23.1 or newer is required for inline configs.content" }

      - name: Verify production environment contract
        shell: pwsh
        run: |
          $compose = @(
            "--project-name", $env:COMPOSE_PROJECT_NAME,
            "-f", "docker-compose.postgres.yml",
            "-f", "tests/compose.postgres-production-validation.yml"
          )
          $savedRequiredValues = @{}
          foreach ($requiredName in @("POSTGRES_PASSWORD", "IPFS_S3_ACCESS_KEY_ID", "IPFS_S3_SECRET_ACCESS_KEY", "IPFS_S3_MASTER_KEY")) {
            if (-not (Test-Path -LiteralPath "Env:$requiredName")) { throw "Required job variable is absent before validation: $requiredName" }
            $savedRequiredValues[$requiredName] = [Environment]::GetEnvironmentVariable($requiredName, "Process")
          }
          if ($env:POSTGRES_PASSWORD -notmatch '^[A-Za-z0-9._~-]+$') { throw "POSTGRES_PASSWORD is not URL-safe unreserved text" }
          if ($env:IPFS_S3_MASTER_KEY -notmatch '^[0-9A-Fa-f]{64}$') { throw "IPFS_S3_MASTER_KEY is not exactly 64 hexadecimal characters" }
          if ($env:IPFS_S3_GATEWAY_BIND -in @("", "0.0.0.0", "::", "[::]")) { throw "IPFS_S3_GATEWAY_BIND must be explicit and non-wildcard" }
          $gatewayPort = 0
          if (-not [int]::TryParse($env:IPFS_S3_GATEWAY_PORT, [ref]$gatewayPort) -or $gatewayPort -lt 1 -or $gatewayPort -gt 65535) { throw "IPFS_S3_GATEWAY_PORT must be decimal 1 through 65535" }
          foreach ($name in @(
            "POSTGRES_PASSWORD",
            "IPFS_S3_ACCESS_KEY_ID",
            "IPFS_S3_SECRET_ACCESS_KEY",
            "IPFS_S3_MASTER_KEY"
          )) {
            try {
              Remove-Item -LiteralPath "Env:$name" -ErrorAction Stop
              if (Test-Path -LiteralPath "Env:$name") { throw "Required variable removal did not produce absence: $name" }
              if ($null -ne [Environment]::GetEnvironmentVariable($name, "Process")) { throw "Required variable removal retained a process value: $name" }
              docker compose @compose config --quiet
              $missingExit = $LASTEXITCODE
            } finally {
              foreach ($requiredName in $savedRequiredValues.Keys) {
                [Environment]::SetEnvironmentVariable($requiredName, $savedRequiredValues[$requiredName], "Process")
                if (-not (Test-Path -LiteralPath "Env:$requiredName")) { throw "Required variable restoration lost presence: $requiredName" }
                $restoredRequiredValue = [Environment]::GetEnvironmentVariable($requiredName, "Process")
                if ($restoredRequiredValue -cne $savedRequiredValues[$requiredName]) { throw "Required variable restoration changed value: $requiredName" }
              }
            }
            if ($missingExit -eq 0) { throw "Compose accepted missing required variable: $name" }
          }
          docker compose @compose config --quiet
          if ($LASTEXITCODE -ne 0) { throw "Complete production Compose configuration failed" }

      - name: Claim unique Compose project and fixed ports
        shell: pwsh
        run: |
          $project = $env:COMPOSE_PROJECT_NAME
          $containers = @(docker ps --all --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { throw "Container ownership preflight failed" }
          $networks = @(docker network ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { throw "Network ownership preflight failed" }
          $volumes = @(docker volume ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { throw "Volume ownership preflight failed" }
          if (($containers.Count + $networks.Count + $volumes.Count) -ne 0) {
            throw "Unique Compose project already owns resources: $project"
          }
          foreach ($port in @(55433, 55001, 59000)) {
            $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, $port)
            try { $listener.Start() } catch { throw "Fixed validation port is occupied: $port" } finally { $listener.Stop() }
          }
          "POSTGRES_PRODUCTION_OWNED=true" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build and start production topology
        shell: pwsh
        run: |
          "POSTGRES_PRODUCTION_ATTEMPTED=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.postgres.yml -f tests/compose.postgres-production-validation.yml up --detach --build --wait --wait-timeout 300 postgres kubo gateway
          if ($LASTEXITCODE -ne 0) { throw "Production topology did not become healthy" }

      - name: Verify liveness and readiness
        shell: pwsh
        run: |
          $health = Invoke-WebRequest -Uri "http://127.0.0.1:59000/health" -TimeoutSec 5
          if ($health.StatusCode -ne 200 -or $health.Content -cne "OK") { throw "Unexpected liveness response" }
          $ready = Invoke-WebRequest -Uri "http://127.0.0.1:59000/ready" -TimeoutSec 5
          if ($ready.StatusCode -ne 200 -or $ready.Content -cne "READY") { throw "Unexpected readiness response" }

      - name: Verify latest migration, JSON columns, and application role
        shell: pwsh
        run: |
          $migrationOutput = @(docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.postgres.yml -f tests/compose.postgres-production-validation.yml exec -T postgres psql -U postgres -d ipfs3 -tA -c "SELECT version FROM seaql_migrations WHERE version = 'm20260813_000001_postgres_json_columns'; SELECT rolname || ':' || rolsuper::text FROM pg_roles WHERE rolname = 'ipfs3'; SELECT table_name || '.' || column_name || ':' || data_type FROM information_schema.columns WHERE table_schema = current_schema() AND (table_name, column_name) IN (('multipart_uploads', 'metadata'), ('multipart_uploads', 'tags_json'), ('objects', 'metadata')) ORDER BY table_name, column_name;")
          if ($LASTEXITCODE -ne 0) { throw "Migration, JSON-column, and application-role query failed" }
          $databaseContract = @($migrationOutput | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" })
          $expectedDatabaseContract = @(
            "m20260813_000001_postgres_json_columns",
            "ipfs3:false",
            "multipart_uploads.metadata:jsonb",
            "multipart_uploads.tags_json:jsonb",
            "objects.metadata:jsonb"
          )
          if ($databaseContract.Count -ne $expectedDatabaseContract.Count) { throw "Unexpected database contract rows: $($databaseContract -join ', ')" }
          for ($index = 0; $index -lt $expectedDatabaseContract.Count; $index++) {
            if ($databaseContract[$index] -cne $expectedDatabaseContract[$index]) { throw "Unexpected database contract row ${index}: $($databaseContract[$index])" }
          }

      - name: Run serial PostgreSQL-backed end-to-end tests
        run: cargo test --test e2e -- --nocapture --test-threads=1

      - name: Stop PostgreSQL and verify readiness failure
        shell: pwsh
        run: |
          docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.postgres.yml -f tests/compose.postgres-production-validation.yml stop postgres
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL stop failed" }
          $health = Invoke-WebRequest -Uri "http://127.0.0.1:59000/health" -TimeoutSec 5
          if ($health.StatusCode -ne 200 -or $health.Content -cne "OK") { throw "Liveness failed after PostgreSQL stopped" }
          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          $observed = $false
          do {
            try {
              $ready = Invoke-WebRequest -Uri "http://127.0.0.1:59000/ready" -TimeoutSec 3 -SkipHttpErrorCheck
              if ($ready.StatusCode -eq 503 -and $ready.Content -ceq "NOT READY") { $observed = $true; break }
            } catch {
              Write-Host "Readiness request has not reached the expected 503 response"
            }
            Start-Sleep -Milliseconds 500
          } while ([DateTime]::UtcNow -lt $deadline)
          if (-not $observed) { throw "Readiness did not become 503 NOT READY within ten seconds" }

      - name: Production Compose diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:POSTGRES_PRODUCTION_ATTEMPTED -ne "true") { Write-Host "Production topology was not attempted"; exit 0 }
          docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.postgres.yml -f tests/compose.postgres-production-validation.yml logs --no-color postgres kubo gateway
          if ($LASTEXITCODE -ne 0) { Write-Warning "Production Compose diagnostics failed" }

      - name: Production Compose cleanup and residual assertion
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:POSTGRES_PRODUCTION_OWNED -ne "true" -or $env:POSTGRES_PRODUCTION_ATTEMPTED -ne "true") { Write-Host "No owned production topology requires cleanup"; exit 0 }
          $project = $env:COMPOSE_PROJECT_NAME
          docker compose --project-name $project -f docker-compose.postgres.yml -f tests/compose.postgres-production-validation.yml down --volumes --remove-orphans
          $downExit = $LASTEXITCODE
          $containers = @(docker ps --all --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $containerExit = $LASTEXITCODE
          $networks = @(docker network ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $networkExit = $LASTEXITCODE
          $volumes = @(docker volume ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $volumeExit = $LASTEXITCODE
          if ($downExit -ne 0 -or $containerExit -ne 0 -or $networkExit -ne 0 -or $volumeExit -ne 0) { throw "Production cleanup or residual query failed" }
          if (($containers.Count + $networks.Count + $volumes.Count) -ne 0) { throw "Residual Compose resources remain for project: $project" }

  multi-gateway-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_DISABLE_ENV_FILE: "1"
      COMPOSE_PROJECT_NAME: ipfs3-mg-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: mg-${{ github.run_id }}-${{ github.run_attempt }}
      IPFS_S3_ACCESS_KEY_ID: test
      IPFS_S3_SECRET_ACCESS_KEY: test
      IPFS_S3_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      IPFS_S3_LOAD_BALANCER_BIND: 127.0.0.1
      IPFS_S3_LOAD_BALANCER_PORT: 59000
      IPFS_S3_MULTI_GATEWAY_A_ENDPOINT: http://127.0.0.1:59001
      IPFS_S3_MULTI_GATEWAY_B_ENDPOINT: http://127.0.0.1:59002
      IPFS_S3_MULTI_GATEWAY_LOAD_BALANCER_ENDPOINT: http://127.0.0.1:59000
      IPFS_S3_MULTI_GATEWAY_KUBO_URL: http://127.0.0.1:55002
      IPFS_S3_E2E_ENDPOINT: http://127.0.0.1:59000
      IPFS_S3_E2E_KUBO_URL: http://127.0.0.1:55002
      IPFS_S3_TEST_POSTGRES_URL: postgres://ipfs3:mg-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:55434/ipfs3
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Docker Compose for multi-gateway deployment
        shell: pwsh
        run: |
          docker compose version
          if ($LASTEXITCODE -ne 0) { throw "Docker Compose v2 is unavailable" }
          $composeVersionText = (docker compose version --short).Trim()
          $composeVersionMatch = [regex]::Match($composeVersionText, '^v?(?<core>\d+\.\d+\.\d+)(?:[-+][0-9A-Za-z.-]+)?$')
          $composeVersion = $null
          if (-not $composeVersionMatch.Success -or -not [Version]::TryParse($composeVersionMatch.Groups["core"].Value, [ref]$composeVersion) -or $composeVersion -lt [Version]"2.23.1") { throw "Docker Compose 2.23.1 or newer is required for inline configs.content" }

      - name: Verify multi-gateway environment contract
        shell: pwsh
        run: |
          $compose = @(
            "--project-name", $env:COMPOSE_PROJECT_NAME,
            "-f", "docker-compose.multi-gateway.yml",
            "-f", "tests/compose.multi-gateway-validation.yml"
          )
          $requiredNames = @("POSTGRES_PASSWORD", "IPFS_S3_ACCESS_KEY_ID", "IPFS_S3_SECRET_ACCESS_KEY", "IPFS_S3_MASTER_KEY")
          $savedRequiredValues = @{}
          foreach ($requiredName in $requiredNames) {
            if (-not (Test-Path -LiteralPath "Env:$requiredName")) { throw "Required job variable is absent before validation: $requiredName" }
            $savedRequiredValues[$requiredName] = [Environment]::GetEnvironmentVariable($requiredName, "Process")
          }
          if ($env:POSTGRES_PASSWORD -notmatch '^[A-Za-z0-9._~-]+$') { throw "POSTGRES_PASSWORD is not URL-safe unreserved text" }
          if ($env:IPFS_S3_MASTER_KEY -notmatch '^[0-9A-Fa-f]{64}$') { throw "IPFS_S3_MASTER_KEY is not exactly 64 hexadecimal characters" }
          if ($env:IPFS_S3_LOAD_BALANCER_BIND -in @("", "0.0.0.0", "::", "[::]")) { throw "IPFS_S3_LOAD_BALANCER_BIND must be explicit and non-wildcard" }
          $loadBalancerPort = 0
          if (-not [int]::TryParse($env:IPFS_S3_LOAD_BALANCER_PORT, [ref]$loadBalancerPort) -or $loadBalancerPort -lt 1 -or $loadBalancerPort -gt 65535) { throw "IPFS_S3_LOAD_BALANCER_PORT must be decimal 1 through 65535" }
          foreach ($name in $requiredNames) {
            try {
              Remove-Item -LiteralPath "Env:$name" -ErrorAction Stop
              if (Test-Path -LiteralPath "Env:$name") { throw "Required variable removal did not produce absence: $name" }
              if ($null -ne [Environment]::GetEnvironmentVariable($name, "Process")) { throw "Required variable removal retained a process value: $name" }
              docker compose @compose config --quiet
              $missingExit = $LASTEXITCODE
            } finally {
              foreach ($requiredName in $savedRequiredValues.Keys) {
                [Environment]::SetEnvironmentVariable($requiredName, $savedRequiredValues[$requiredName], "Process")
                if (-not (Test-Path -LiteralPath "Env:$requiredName")) { throw "Required variable restoration lost presence: $requiredName" }
                $restoredRequiredValue = [Environment]::GetEnvironmentVariable($requiredName, "Process")
                if ($restoredRequiredValue -cne $savedRequiredValues[$requiredName]) { throw "Required variable restoration changed value: $requiredName" }
              }
            }
            if ($missingExit -eq 0) { throw "Compose accepted missing required variable: $name" }
          }
          docker compose @compose config --quiet
          if ($LASTEXITCODE -ne 0) { throw "Complete multi-gateway Compose configuration failed" }

      - name: Claim unique multi-gateway project and fixed ports
        shell: pwsh
        run: |
          $project = $env:COMPOSE_PROJECT_NAME
          $containers = @(docker ps --all --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { throw "Container ownership preflight failed" }
          $networks = @(docker network ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { throw "Network ownership preflight failed" }
          $volumes = @(docker volume ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { throw "Volume ownership preflight failed" }
          if (($containers.Count + $networks.Count + $volumes.Count) -ne 0) { throw "Unique Compose project already owns resources: $project" }
          foreach ($port in @(55434, 55002, 59000, 59001, 59002)) {
            $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, $port)
            try { $listener.Start() } catch { throw "Fixed validation port is occupied: $port" } finally { $listener.Stop() }
          }
          "MULTI_GATEWAY_OWNED=true" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build and start the multi-gateway topology
        shell: pwsh
        run: |
          "MULTI_GATEWAY_ATTEMPTED=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.multi-gateway.yml -f tests/compose.multi-gateway-validation.yml up --detach --build --wait --wait-timeout 300 postgres kubo gateway-a gateway-b load-balancer
          if ($LASTEXITCODE -ne 0) { throw "Multi-gateway topology did not become healthy" }

      - name: Verify both gateways, load balancer, and migrations
        shell: pwsh
        run: |
          foreach ($probe in @(
            @("http://127.0.0.1:59001/ready", "READY"),
            @("http://127.0.0.1:59002/ready", "READY"),
            @("http://127.0.0.1:59000/health", "READY"),
            @("http://127.0.0.1:59000/ready", "READY")
          )) {
            $response = Invoke-WebRequest -Uri $probe[0] -TimeoutSec 5
            if ($response.StatusCode -ne 200 -or $response.Content -cne $probe[1]) { throw "Unexpected multi-gateway readiness response: $($probe[0])" }
          }
          $migrationOutput = @(docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.multi-gateway.yml -f tests/compose.multi-gateway-validation.yml exec -T postgres psql -U postgres -d ipfs3 -tA -c "SELECT version || ':' || COUNT(*)::text FROM seaql_migrations GROUP BY version ORDER BY version;")
          if ($LASTEXITCODE -ne 0) { throw "Migration marker query failed" }
          $actualMigrations = @($migrationOutput | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" })
          $expectedMigrations = @(
            "m20250701_000001_init:1",
            "m20260707_000001_decompress_zip:1",
            "m20260720_000001_sse_c_key_fingerprint:1",
            "m20260721_000001_multi_provider_pinning:1",
            "m20260729_000001_ipfs3_import:1",
            "m20260729_000002_postgres_utc_timestamps:1",
            "m20260730_000001_standard_mutation_fence:1",
            "m20260813_000001_postgres_json_columns:1"
          )
          if ($actualMigrations.Count -ne $expectedMigrations.Count) { throw "Unexpected migration marker count" }
          for ($index = 0; $index -lt $expectedMigrations.Count; $index++) {
            if ($actualMigrations[$index] -cne $expectedMigrations[$index]) { throw "Unexpected migration marker at index $index" }
          }

      - name: Run direct cross-replica acceptance
        run: cargo test --test multi_gateway multi_gateway_cross_replica_contract -- --exact --nocapture --test-threads=1

      - name: Run existing E2E through the load balancer
        run: cargo test --test e2e -- --nocapture --test-threads=1

      - name: Capture pre-failover diagnostics
        shell: pwsh
        run: |
          docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.multi-gateway.yml -f tests/compose.multi-gateway-validation.yml logs --no-color postgres kubo gateway-a gateway-b load-balancer
          if ($LASTEXITCODE -ne 0) { throw "Pre-failover diagnostics failed" }

      - name: Stop gateway A and verify surviving route
        shell: pwsh
        run: |
          docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.multi-gateway.yml -f tests/compose.multi-gateway-validation.yml stop gateway-a
          if ($LASTEXITCODE -ne 0) { throw "Gateway A stop failed" }
          $gatewayB = Invoke-WebRequest -Uri "http://127.0.0.1:59002/ready" -TimeoutSec 5
          if ($gatewayB.StatusCode -ne 200 -or $gatewayB.Content -cne "READY") { throw "Gateway B is not ready after gateway A stopped" }
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          $observed = $false
          do {
            try {
              $loadBalancer = Invoke-WebRequest -Uri "http://127.0.0.1:59000/ready" -TimeoutSec 5 -SkipHttpErrorCheck
              if ($loadBalancer.StatusCode -eq 200 -and $loadBalancer.Content -ceq "READY") { $observed = $true; break }
            } catch {
              Write-Host "Load balancer has not reached the surviving gateway"
            }
            Start-Sleep -Milliseconds 500
          } while ([DateTime]::UtcNow -lt $deadline)
          if (-not $observed) { throw "Load balancer did not recover through gateway B within 30 seconds" }

      - name: Run new CRUD through the surviving load-balanced path
        run: cargo test --test multi_gateway load_balancer_surviving_replica_crud -- --exact --nocapture --test-threads=1

      - name: Multi-gateway Compose diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:MULTI_GATEWAY_ATTEMPTED -ne "true") { Write-Host "Multi-gateway topology was not attempted"; exit 0 }
          docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.multi-gateway.yml -f tests/compose.multi-gateway-validation.yml logs --no-color postgres kubo gateway-a gateway-b load-balancer
          if ($LASTEXITCODE -ne 0) { Write-Warning "Multi-gateway Compose diagnostics failed" }

      - name: Multi-gateway Compose cleanup and residual assertion
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:MULTI_GATEWAY_OWNED -ne "true" -or $env:MULTI_GATEWAY_ATTEMPTED -ne "true") { Write-Host "No owned multi-gateway topology requires cleanup"; exit 0 }
          $project = $env:COMPOSE_PROJECT_NAME
          docker compose --project-name $project -f docker-compose.multi-gateway.yml -f tests/compose.multi-gateway-validation.yml down --volumes --remove-orphans
          $downExit = $LASTEXITCODE
          $containers = @(docker ps --all --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $containerExit = $LASTEXITCODE
          $networks = @(docker network ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $networkExit = $LASTEXITCODE
          $volumes = @(docker volume ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $volumeExit = $LASTEXITCODE
           if ($downExit -ne 0 -or $containerExit -ne 0 -or $networkExit -ne 0 -or $volumeExit -ne 0) { throw "Multi-gateway cleanup or residual query failed" }
           if (($containers.Count + $networks.Count + $volumes.Count) -ne 0) { throw "Residual Compose resources remain for project: $project" }

  cluster-pinset-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_DISABLE_ENV_FILE: "1"
      COMPOSE_PROJECT_NAME: ipfs3-cl-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: cl-${{ github.run_id }}-${{ github.run_attempt }}
      IPFS_S3_ACCESS_KEY_ID: test
      IPFS_S3_SECRET_ACCESS_KEY: test
      IPFS_S3_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      IPFS_S3_CLUSTER_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      IPFS_S3_GATEWAY_BIND: 127.0.0.1
      IPFS_S3_GATEWAY_PORT: 59100
      IPFS_S3_CLUSTER_GATEWAY_ENDPOINT: http://127.0.0.1:59100
      IPFS_S3_CLUSTER_A_REST_URL: http://127.0.0.1:59101
      IPFS_S3_CLUSTER_B_REST_URL: http://127.0.0.1:59102
      IPFS_S3_CLUSTER_A_PROXY_URL: http://127.0.0.1:59103
      IPFS_S3_CLUSTER_KUBO_A_URL: http://127.0.0.1:55100
      IPFS_S3_CLUSTER_KUBO_B_URL: http://127.0.0.1:55101
      IPFS_S3_CLUSTER_KUBO_C_URL: http://127.0.0.1:55102
      IPFS_S3_SWARM_KEY_FILE: ${{ runner.temp }}/ipfs3-swarm-${{ github.run_id }}-${{ github.run_attempt }}.key
      IPFS_S3_SWARM_KEY_WRONG_FILE: ${{ runner.temp }}/ipfs3-swarm-wrong-${{ github.run_id }}-${{ github.run_attempt }}.key
      IPFS_S3_CLUSTER_STATE_PATH: ${{ runner.temp }}/ipfs3-cluster-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Docker Compose for Cluster deployment
        shell: pwsh
        run: |
          docker compose version
          if ($LASTEXITCODE -ne 0) { throw "Docker Compose v2 is unavailable" }
          $composeVersionText = (docker compose version --short).Trim()
          $composeVersionMatch = [regex]::Match($composeVersionText, '^v?(?<core>\d+\.\d+\.\d+)(?:[-+][0-9A-Za-z.-]+)?$')
          $composeVersion = $null
          if (-not $composeVersionMatch.Success -or
              -not [Version]::TryParse($composeVersionMatch.Groups["core"].Value, [ref]$composeVersion) -or
              $composeVersion -lt [Version]"2.23.1") {
              throw "Docker Compose 2.23.1 or newer is required for inline configs.content"
          }

      - name: Verify Cluster environment contract
        shell: pwsh
        run: |
          function New-PrivateSwarmHex {
              $bytes = [byte[]]::new(32)
              [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
              $hex = [Convert]::ToHexString($bytes).ToLowerInvariant()
              $decoded = [Convert]::FromHexString($hex)
              if ($hex -notmatch '^[0-9a-f]{64}$' -or $decoded.Length -ne 32 -or [Convert]::ToHexString($decoded).ToLowerInvariant() -cne $hex) {
                  throw "Private swarm random key decoding failed"
              }
              return $hex
          }
          function Write-PrivateSwarmKey {
              param(
                  [Parameter(Mandatory)][string]$Path,
                  [Parameter(Mandatory)][string]$Hex
              )
              $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
              $canonicalPath = [IO.Path]::GetFullPath($Path)
              if ([IO.Path]::GetDirectoryName($canonicalPath) -cne $runnerTemp) { throw "Private swarm key path must have RUNNER_TEMP as its canonical parent" }
              $decoded = [Convert]::FromHexString($Hex)
              if ($Hex -notmatch '^[0-9a-f]{64}$' -or $decoded.Length -ne 32 -or [Convert]::ToHexString($decoded).ToLowerInvariant() -cne $Hex) {
                  throw "Private swarm key encoding is invalid"
              }
              $bytes = [Text.Encoding]::ASCII.GetBytes("/key/swarm/psk/1.0.0/`n/base16/`n$Hex`n")
              if ($bytes.Length -ne 96) { throw "Private swarm key must be exactly 96 ASCII LF bytes" }
              $stream = $null
              $created = $false
              try {
                  $stream = [IO.File]::Open($canonicalPath, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
                  $created = $true
                  $stream.Write($bytes, 0, $bytes.Length)
                  $stream.Flush($true)
              } catch {
                  if ($null -ne $stream) { $stream.Dispose(); $stream = $null }
                  if ($created) { Remove-Item -LiteralPath $canonicalPath -Force -ErrorAction SilentlyContinue }
                  throw
              } finally {
                  if ($null -ne $stream) { $stream.Dispose() }
              }
          }
          $mainSwarmHex = New-PrivateSwarmHex
          do { $wrongSwarmHex = New-PrivateSwarmHex } while ($wrongSwarmHex -ceq $mainSwarmHex)
          Write-PrivateSwarmKey -Path $env:IPFS_S3_SWARM_KEY_FILE -Hex $mainSwarmHex
          "CLUSTER_SWARM_KEY_OWNED=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-PrivateSwarmKey -Path $env:IPFS_S3_SWARM_KEY_WRONG_FILE -Hex $wrongSwarmHex
          "CLUSTER_SWARM_KEY_WRONG_OWNED=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          $mainSwarmHex = $null
          $wrongSwarmHex = $null
          "CLUSTER_SWARM_KEY_FILES_READY=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          $compose = @(
              "--project-name", $env:COMPOSE_PROJECT_NAME,
              "-f", "docker-compose.cluster.yml",
              "-f", "tests/compose.cluster-validation.yml"
          )
          $requiredNames = @(
              "POSTGRES_PASSWORD",
              "IPFS_S3_ACCESS_KEY_ID",
              "IPFS_S3_SECRET_ACCESS_KEY",
              "IPFS_S3_MASTER_KEY",
              "IPFS_S3_CLUSTER_SECRET",
              "IPFS_S3_GATEWAY_BIND",
              "IPFS_S3_GATEWAY_PORT",
              "IPFS_S3_SWARM_KEY_FILE",
              "IPFS_S3_SWARM_KEY_WRONG_FILE"
          )
          $savedRequiredValues = @{}
          foreach ($requiredName in $requiredNames) {
              if (-not (Test-Path -LiteralPath "Env:$requiredName")) { throw "Required job variable is absent: $requiredName" }
              $savedRequiredValues[$requiredName] = [Environment]::GetEnvironmentVariable($requiredName, "Process")
          }
          if ($env:POSTGRES_PASSWORD -notmatch '^[A-Za-z0-9._~-]+$') { throw "POSTGRES_PASSWORD must be URL-safe unreserved text" }
          if ([string]::IsNullOrWhiteSpace($env:IPFS_S3_ACCESS_KEY_ID)) { throw "S3 access key must be nonempty" }
          if ([string]::IsNullOrWhiteSpace($env:IPFS_S3_SECRET_ACCESS_KEY)) { throw "S3 secret key must be nonempty" }
          if ($env:IPFS_S3_MASTER_KEY -notmatch '^[0-9A-Fa-f]{64}$' -or $env:IPFS_S3_MASTER_KEY -match '^0{64}$') { throw "Master key must be nonzero 64-hex" }
          if ($env:IPFS_S3_CLUSTER_SECRET -notmatch '^[0-9A-Fa-f]{64}$') { throw "Cluster secret must be exactly 64-hex" }
          if ($env:IPFS_S3_GATEWAY_BIND -cne "127.0.0.1") { throw "Gateway bind must be exactly 127.0.0.1" }
          $gatewayPort = 0
          if (-not [int]::TryParse($env:IPFS_S3_GATEWAY_PORT, [ref]$gatewayPort) -or $gatewayPort -ne 59100) { throw "Validation gateway port must be exactly 59100" }
          foreach ($name in $requiredNames) {
              try {
                  Remove-Item -LiteralPath "Env:$name" -ErrorAction Stop
                  if (Test-Path -LiteralPath "Env:$name") { throw "Required variable removal retained presence: $name" }
                  docker compose @compose config --quiet
                  $missingExit = $LASTEXITCODE
              } finally {
                  foreach ($requiredName in $savedRequiredValues.Keys) {
                      [Environment]::SetEnvironmentVariable($requiredName, $savedRequiredValues[$requiredName], "Process")
                      if (-not (Test-Path -LiteralPath "Env:$requiredName")) { throw "Required variable restoration lost presence: $requiredName" }
                      if ([Environment]::GetEnvironmentVariable($requiredName, "Process") -cne $savedRequiredValues[$requiredName]) {
                          throw "Required variable restoration changed value: $requiredName"
                      }
                  }
              }
              if ($missingExit -eq 0) { throw "Compose accepted missing required variable: $name" }
          }
          docker compose @compose config --quiet
          if ($LASTEXITCODE -ne 0) { throw "Complete Cluster Compose configuration failed" }

      - name: Claim unique Cluster project, ports, and state receipt
        shell: pwsh
        run: |
          $project = $env:COMPOSE_PROJECT_NAME
          $containers = @(docker ps --all --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $containerExit = $LASTEXITCODE
          $networks = @(docker network ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $networkExit = $LASTEXITCODE
          $volumes = @(docker volume ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $volumeExit = $LASTEXITCODE
          if ($containerExit -ne 0 -or $networkExit -ne 0 -or $volumeExit -ne 0) { throw "Project ownership preflight query failed" }
          if (($containers.Count + $networks.Count + $volumes.Count) -ne 0) { throw "Unique project already owns resources: $project" }
          foreach ($port in @(55435, 55100, 55101, 55102, 59100, 59101, 59102, 59103)) {
              $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, $port)
              try { $listener.Start() } catch { throw "Fixed validation port is occupied: $port" } finally { $listener.Stop() }
          }
          if (Test-Path -LiteralPath $env:IPFS_S3_CLUSTER_STATE_PATH) { throw "Cluster state receipt already exists" }
          "CLUSTER_PINSET_OWNED=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          $stateReceiptOwned = $false
          $receipt = $null
          try {
              $receipt = [IO.File]::Open(
                  $env:IPFS_S3_CLUSTER_STATE_PATH,
                  [IO.FileMode]::CreateNew,
                  [IO.FileAccess]::Write,
                  [IO.FileShare]::None
              )
              $receipt.Dispose()
              $stateReceiptOwned = $true
          } finally {
              if ($null -ne $receipt) { $receipt.Dispose() }
          }
          if (-not $stateReceiptOwned) { throw "State receipt claim did not complete" }
          "CLUSTER_STATE_RECEIPT_OWNED=true" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build and start Cluster topology
        shell: pwsh
        run: |
          "CLUSTER_PINSET_ATTEMPTED=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          function Protect-ClusterDiagnosticLine {
              param([AllowEmptyString()][string]$Line)
              $safe = $Line
              $safe = [regex]::Replace($safe, '(Swarm key fingerprint: )[0-9a-f]{32}(?=\s*$)', '$1[redacted]')
              $safe = [regex]::Replace($safe, '(?m)^/key/swarm/psk/1\.0\.0/\s*$', '[REDACTED_SWARM_KEY_HEADER]')
              $safe = [regex]::Replace($safe, '(?m)^/base16/\s*$', '[REDACTED_SWARM_KEY_HEADER]')
              $safe = [regex]::Replace($safe, '(?<![0-9A-Fa-f])[0-9A-Fa-f]{64}(?![0-9A-Fa-f])', '[REDACTED_HEX]')
              $safe = [regex]::Replace($safe, '(?i)((?:"?)(?:PeerID|peer_id|peer-id)(?:"?)\s*[:=]\s*)(?:"[^"]*"|''[^'']*''|[^\s,;]+)', '$1[REDACTED_PEER_ID]')
              $safe = [regex]::Replace($safe, '(?i)(/p2p/)[1-9A-HJ-NP-Za-km-z]+', '$1[REDACTED_PEER_ID]')
              $safe = [regex]::Replace($safe, '(?<![1-9A-HJ-NP-Za-km-z])12D3Koo[1-9A-HJ-NP-Za-km-z]{20,}(?![1-9A-HJ-NP-Za-km-z])', '[REDACTED_PEER_ID]')
              if ($safe -match '(?i)\b(?:peer(?:[_-]?id)?|peerid|identity|peerstore)\b') {
                  $safe = [regex]::Replace($safe, '(?<![1-9A-HJ-NP-Za-km-z])Qm[1-9A-HJ-NP-Za-km-z]{44}(?![1-9A-HJ-NP-Za-km-z])', '[REDACTED_PEER_ID]')
              }
              return $safe
          }
          function Invoke-PrivateSwarmNegative {
              param([Parameter(Mandatory)][string[]]$RunArgs)
              $rawLines = @(docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.cluster.yml -f tests/compose.cluster-validation.yml run --no-deps --rm @RunArgs kubo-a 2>&1)
              $exitCode = $LASTEXITCODE
              $safeLines = @($rawLines | ForEach-Object { Protect-ClusterDiagnosticLine -Line "$_" })
              $safeText = $safeLines -join "`n"
              if ($exitCode -eq 0) { throw "Private swarm negative probe unexpectedly succeeded" }
              if (([regex]::Matches($safeText, [regex]::Escape('private swarm startup rejected'))).Count -ne 1) { throw "Private swarm negative probe did not produce its fixed rejection" }
              if ($safeText -match '(?i)\b(?:ready|readiness|swarm key|/key/swarm)\b|(?<![0-9A-Fa-f])[0-9A-Fa-f]{64}(?![0-9A-Fa-f])') { throw "Private swarm negative probe emitted forbidden output" }
              [Console]::Out.WriteLine('private swarm startup rejected')
          }
          function Invoke-PrivateSwarmSupervisorProof {
              param(
                  [Parameter(Mandatory)][ValidateSet('normal', 'handled', 'unhandled')][string]$Mode,
                  [Parameter(Mandatory)][int]$ExpectedExit
              )
              $project = $env:COMPOSE_PROJECT_NAME
              $name = "$project-private-swarm-proof-$Mode"
              $fullKeyPath = [IO.Path]::GetFullPath($env:IPFS_S3_SWARM_KEY_FILE)
              $stub = @'
          mkdir -p /tmp/ipfs-stub
          printf '%s\n' '#!/bin/sh' 'case "$1" in' '  init|config) exit 0 ;;' '  daemon)' '    printf "%s\n" "Swarm key fingerprint: $(printf "%032d" 0)"' '    case "$PROOF_MODE" in' '      normal) exit 37 ;;' '      handled) trap "exit 43" TERM; while :; do sleep 1; done ;;' '      unhandled) while :; do sleep 1; done ;;' '    esac' '    ;;' '  *) exit 0 ;;' 'esac' > /tmp/ipfs-stub/ipfs
          chmod 0755 /tmp/ipfs-stub/ipfs
          PATH=/tmp/ipfs-stub:$PATH exec /private-swarm-entrypoint.sh
          '@
              $runArgs = @(
                  "--detach", "--name", $name,
                  "--label", "com.docker.compose.project=$project",
                  "--label", "ipfs3.cluster.private-swarm-proof=$Mode",
                  "--network", "none",
                  "--mount", "type=bind,src=$fullKeyPath,dst=/run/secrets/swarm_key,readonly",
                  "--env", "IPFS_SWARM_KEY_FILE=/run/secrets/swarm_key",
                  "--env", "LIBP2P_FORCE_PNET=1",
                  "--env", "IPFS_PATH=/tmp/ipfs-proof",
                  "--env", "PROOF_MODE=$Mode",
                  "--entrypoint", "/bin/sh",
                  "ghcr.io/hugefiver/ipfs3-kubo-cluster:v0.43.0", "-ec", $stub
              )
              $createOutput = @(docker run @runArgs 2>&1)
              $createExit = $LASTEXITCODE
              if ($createExit -ne 0) { throw "Private swarm supervisor proof container creation failed" }
              if ($Mode -ne 'normal') {
                  Start-Sleep -Milliseconds 500
                  $stopOutput = @(docker stop --time 30 $name 2>&1)
                  if ($LASTEXITCODE -ne 0) { throw "Private swarm supervisor proof TERM delivery failed" }
              }
              $waitOutput = @(docker wait $name 2>&1)
              $waitExit = $LASTEXITCODE
              $waitValues = @($waitOutput | ForEach-Object { "$($_)".Trim() } | Where-Object { $_ -ne "" })
              if ($waitExit -ne 0 -or $waitValues.Count -ne 1 -or $waitValues[0] -cne "$ExpectedExit") { throw "Private swarm supervisor proof docker wait status was unexpected" }
              $stateOutput = @(docker inspect --format '{{.State.Pid}} {{.State.ExitCode}}' $name 2>&1)
              $stateExit = $LASTEXITCODE
              $stateValues = @($stateOutput | ForEach-Object { "$($_)".Trim() } | Where-Object { $_ -ne "" })
              if ($stateExit -ne 0 -or $stateValues.Count -ne 1 -or $stateValues[0] -cne "0 $ExpectedExit") { throw "Private swarm supervisor proof must finish with PID 0 and its exact exit" }
              $proofLogs = @(docker logs $name 2>&1)
              $logsExit = $LASTEXITCODE
              $safeProofLogs = @($proofLogs | ForEach-Object { Protect-ClusterDiagnosticLine -Line "$_" })
              $safeProofText = $safeProofLogs -join "`n"
              if ($logsExit -ne 0 -or $safeProofText -match '(?m)^Swarm key fingerprint: [0-9a-f]{32}\s*$' -or $safeProofText -notmatch [regex]::Escape('Swarm key fingerprint: [redacted]')) { throw "Private swarm supervisor proof did not filter its fingerprint" }
              $proofDiff = @(docker diff $name 2>&1)
              if ($LASTEXITCODE -ne 0 -or ($proofDiff -join "`n") -match '(?im)(?:fifo|daemon-log)') { throw "Private swarm supervisor proof retained a FIFO" }
          }
          $compose = @("--project-name", $env:COMPOSE_PROJECT_NAME, "-f", "docker-compose.cluster.yml", "-f", "tests/compose.cluster-validation.yml")
          $buildOutput = @(docker compose @compose build kubo-a 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Cluster Kubo A build failed" }
          Invoke-PrivateSwarmNegative -RunArgs @("--env", "IPFS_SWARM_KEY_FILE=/run/secrets/missing-swarm-key", "--env", "LIBP2P_FORCE_PNET=1")
          Invoke-PrivateSwarmNegative -RunArgs @("--env", "LIBP2P_FORCE_PNET=0")
          $sourceFixture = @'
          . /private-swarm-entrypoint.sh
          ordinary=0123456789abcdef0123456789abcdef
          cid=Qm$(printf '%044d' 0 | tr 0 c)
          filtered=$(printf '%s\n' "Swarm key fingerprint: $(printf '%032d' 0)" "ordinary $ordinary" "cid=$cid" | redact_swarm_fingerprint)
          expected="Swarm key fingerprint: [redacted]
          ordinary $ordinary
          cid=$cid"
          [ "$filtered" = "$expected" ] || exit 71
          check_selector() {
            expected_status=$1
            daemon_status=$2
            filter_status=$3
            fifo_status=$4
            set +e
            select_supervisor_exit "$daemon_status" "$filter_status" "$fifo_status"
            actual_status=$?
            set -e
            [ "$actual_status" -eq "$expected_status" ] || exit 72
          }
          check_selector 37 37 1 1
          check_selector 1 0 1 0
          check_selector 1 0 0 1
          check_selector 0 0 0 0
          '@
          $sourceFixtureOutput = @(docker run --rm --entrypoint /bin/sh ghcr.io/hugefiver/ipfs3-kubo-cluster:v0.43.0 -ec $sourceFixture 2>&1)
          $sourceFixtureExit = $LASTEXITCODE
          $sourceFixtureOutput = $null
          if ($sourceFixtureExit -ne 0) { throw "Private swarm source-only filter and supervisor fixture failed" }
          "CLUSTER_PRIVATE_SWARM_FILTER_GREEN=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          "CLUSTER_PRIVATE_SWARM_PROOFS_ATTEMPTED=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          Invoke-PrivateSwarmSupervisorProof -Mode normal -ExpectedExit 37
          Invoke-PrivateSwarmSupervisorProof -Mode handled -ExpectedExit 43
          Invoke-PrivateSwarmSupervisorProof -Mode unhandled -ExpectedExit 143
          "CLUSTER_PRIVATE_SWARM_WRAPPER_GREEN=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          "CLUSTER_PRIVATE_SWARM_SUPERVISOR_GREEN=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          $startupOutput = @(docker compose --profile private-swarm-validation @compose up --detach --build --wait --wait-timeout 300 postgres kubo-a kubo-b kubo-c swarm-bootstrap cluster-a cluster-b gateway 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Cluster topology did not become healthy" }
          $rawKuboLogs = @(docker compose @compose logs --no-color kubo-a kubo-b kubo-c 2>&1)
          $rawKuboLogExit = $LASTEXITCODE
          if ($rawKuboLogExit -ne 0) { throw "Direct Kubo log receipt failed" }
          $rawKuboText = $rawKuboLogs -join "`n"
          if ($rawKuboText -match '(?m)^.*Swarm key fingerprint: [0-9a-f]{32}\s*$') { throw "Direct Kubo logs exposed a raw swarm fingerprint" }
          $rawKuboRedactedFingerprintCount = ([regex]::Matches($rawKuboText, [regex]::Escape('Swarm key fingerprint: [redacted]'))).Count
          if ($rawKuboRedactedFingerprintCount -lt 3) { throw "Direct Kubo logs did not contain three redacted swarm fingerprint markers" }
          Write-Host "PRIVATE_SWARM_DIRECT_KUBO_LOGS_CAPTURED"
          Write-Host "PRIVATE_SWARM_DIRECT_KUBO_FINGERPRINT_ABSENT"
          Write-Host "PRIVATE_SWARM_DIRECT_KUBO_MARKERS_VERIFIED"
          "CLUSTER_PRIVATE_SWARM_DIRECT_LOGS_GREEN=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          $rawKuboLogs = $null
          $rawKuboText = $null
          $rawKuboRedactedFingerprintCount = $null
          $bootstrapId = @(docker compose @compose ps --all -q swarm-bootstrap 2>&1)
          if ($LASTEXITCODE -ne 0 -or $bootstrapId.Count -ne 1 -or [string]::IsNullOrWhiteSpace("$($bootstrapId[0])")) { throw "Private swarm bootstrap container receipt is unavailable" }
          $bootstrapState = @(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }} {{ index .Config.Labels "com.docker.compose.service" }} {{ .State.Status }} {{ .State.ExitCode }}' $bootstrapId[0] 2>&1)
          if ($LASTEXITCODE -ne 0 -or $bootstrapState.Count -ne 1 -or "$($bootstrapState[0])".Trim() -cne "$($env:COMPOSE_PROJECT_NAME) swarm-bootstrap exited 0") { throw "Private swarm bootstrap container receipt is invalid" }
          Write-Host "PRIVATE_SWARM_BOOTSTRAP_RECEIPT"
          "CLUSTER_PRIVATE_SWARM_BOOTSTRAP_GREEN=true" | Add-Content -LiteralPath $env:GITHUB_ENV
          $modeDigestA = $null
          $modeDigestB = $null
          $modeDigestAMatch = $null
          $modeDigestBMatch = $null
          try {
              $modeDigestA = @(docker compose @compose exec -T kubo-a /bin/sh -ec 'mode=$(stat -c "%a" "$IPFS_PATH/swarm.key") || exit 1; digest=$(sha256sum "$IPFS_PATH/swarm.key" | awk "{print \$1}") || exit 1; printf "%s %s\n" "$mode" "$digest"' 2>&1)
              $modeDigestAExit = $LASTEXITCODE
              $modeDigestB = @(docker compose @compose exec -T kubo-b /bin/sh -ec 'mode=$(stat -c "%a" "$IPFS_PATH/swarm.key") || exit 1; digest=$(sha256sum "$IPFS_PATH/swarm.key" | awk "{print \$1}") || exit 1; printf "%s %s\n" "$mode" "$digest"' 2>&1)
              $modeDigestBExit = $LASTEXITCODE
              if ($modeDigestAExit -ne 0 -or $modeDigestBExit -ne 0 -or $modeDigestA.Count -ne 1 -or $modeDigestB.Count -ne 1) { throw "Private swarm key mode receipt failed" }
              $modeDigestAMatch = [regex]::Match("$($modeDigestA[0])".Trim(), '^400 (?<digest>[0-9a-f]{64})$')
              $modeDigestBMatch = [regex]::Match("$($modeDigestB[0])".Trim(), '^400 (?<digest>[0-9a-f]{64})$')
              if (-not $modeDigestAMatch.Success -or -not $modeDigestBMatch.Success -or $modeDigestAMatch.Groups['digest'].Value -cne $modeDigestBMatch.Groups['digest'].Value) { throw "Private swarm key mode or equality receipt failed" }
          } finally {
              $modeDigestA = $null
              $modeDigestB = $null
              $modeDigestAMatch = $null
              $modeDigestBMatch = $null
          }
          Write-Host "PRIVATE_SWARM_KEY_MODE_AND_EQUALITY_RECEIPT"
          "CLUSTER_PRIVATE_SWARM_KEY_MATERIAL_GREEN=true" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Prove Cluster release-version representation contract
        shell: pwsh
        run: |
          cargo test --test cluster cluster_support::release_version_validator_accepts_exact_release_and_build_metadata -- --exact
          if ($LASTEXITCODE -ne 0) { throw "Cluster release-version unit contract failed" }

      - name: Prove private swarm causality before topology
        shell: pwsh
        run: |
          foreach ($receipt in @(
              "CLUSTER_PRIVATE_SWARM_WRAPPER_GREEN",
              "CLUSTER_PRIVATE_SWARM_FILTER_GREEN",
              "CLUSTER_PRIVATE_SWARM_SUPERVISOR_GREEN",
              "CLUSTER_PRIVATE_SWARM_DIRECT_LOGS_GREEN",
              "CLUSTER_PRIVATE_SWARM_BOOTSTRAP_GREEN",
              "CLUSTER_PRIVATE_SWARM_KEY_MATERIAL_GREEN"
          )) {
              if ([Environment]::GetEnvironmentVariable($receipt, "Process") -ne "true") { throw "Private swarm receipt is required before topology" }
          }
          cargo test --test cluster cluster_support::private_kubo_config_contract_rejects_open_discovery -- --exact
          if ($LASTEXITCODE -ne 0) { throw "Private Kubo configuration unit contract failed" }
          cargo test --test cluster cluster_support::private_peering_json_contract_matches_kubo_v0_43_addrinfo -- --exact
          if ($LASTEXITCODE -ne 0) { throw "Private Kubo peering unit contract failed" }
          cargo test --test cluster cluster_support::kubo_swarm_peers_null_is_empty_without_ndjson -- --exact
          if ($LASTEXITCODE -ne 0) { throw "Kubo swarm-peers null unit contract failed" }
          cargo test --test cluster private_swarm_configuration_and_peering -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Private swarm configuration and peering contract failed" }
          cargo test --test cluster private_swarm_wrong_key_rejected -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Private swarm wrong-key rejection contract failed" }
          "CLUSTER_PRIVATE_SWARM_GREEN=true" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Prove exact two-peer topology without writes
        shell: pwsh
        run: |
          if ($env:CLUSTER_PRIVATE_SWARM_GREEN -ne "true") { throw "Private swarm GREEN receipt is required before topology" }
          cargo test --test cluster cluster_topology_converges -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "TOPOLOGY_CONVERGENCE_BLOCKER: exact v1.1.6 two-peer topology did not converge" }
          "CLUSTER_TOPOLOGY_GREEN=true" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Prove direct Kubo wire compatibility against Cluster A proxy
        shell: pwsh
        run: |
          if ($env:CLUSTER_TOPOLOGY_GREEN -ne "true") { throw "Topology GREEN receipt is required before compatibility" }
          cargo test --test cluster cluster_proxy_compatibility -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "PROXY_COMPATIBILITY_BLOCKER: stop and revise the approved design; do not add app fallback code" }
          "CLUSTER_PROXY_COMPATIBILITY_GREEN=true" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Prove replication and retained deletion
        shell: pwsh
        run: |
          if ($env:CLUSTER_PROXY_COMPATIBILITY_GREEN -ne "true") { throw "Add-pin-cat proxy GREEN receipt is required before replication" }
          if ($env:CLUSTER_STATE_RECEIPT_OWNED -ne "true") { throw "Owned state receipt is required before replication" }
          cargo test --test cluster cluster_replication_and_retention -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Cluster replication and retention contract failed" }

      - name: Capture diagnostics before peer B stop
        shell: pwsh
        run: |
          function Protect-ClusterDiagnosticLine {
              param([AllowEmptyString()][string]$Line)
              $safe = $Line
              $safe = [regex]::Replace($safe, '(Swarm key fingerprint: )[0-9a-f]{32}(?=\s*$)', '$1[redacted]')
              $safe = [regex]::Replace($safe, '(?m)^/key/swarm/psk/1\.0\.0/\s*$', '[REDACTED_SWARM_KEY_HEADER]')
              $safe = [regex]::Replace($safe, '(?m)^/base16/\s*$', '[REDACTED_SWARM_KEY_HEADER]')
              $safe = [regex]::Replace($safe, '(?<![0-9A-Fa-f])[0-9A-Fa-f]{64}(?![0-9A-Fa-f])', '[REDACTED_HEX]')
              $safe = [regex]::Replace(
                  $safe,
                  '(?i)((?:"?)(?:PeerID|peer_id|peer-id)(?:"?)\s*[:=]\s*)(?:"[^"]*"|''[^'']*''|[^\s,;]+)',
                  '$1[REDACTED_PEER_ID]'
              )
              $safe = [regex]::Replace(
                  $safe,
                  '(?i)(/p2p/)[1-9A-HJ-NP-Za-km-z]+',
                  '$1[REDACTED_PEER_ID]'
              )
              $safe = [regex]::Replace(
                  $safe,
                  '(?<![1-9A-HJ-NP-Za-km-z])12D3Koo[1-9A-HJ-NP-Za-km-z]{20,}(?![1-9A-HJ-NP-Za-km-z])',
                  '[REDACTED_PEER_ID]'
              )
              if ($safe -match '(?i)\b(?:peer(?:[_-]?id)?|peerid|identity|peerstore)\b') {
                  $safe = [regex]::Replace(
                      $safe,
                      '(?<![1-9A-HJ-NP-Za-km-z])Qm[1-9A-HJ-NP-Za-km-z]{44}(?![1-9A-HJ-NP-Za-km-z])',
                      '[REDACTED_PEER_ID]'
                  )
              }
              $safe
          }
          function Write-SanitizedClusterDiagnostics {
              param(
                  [Parameter(Mandatory)][string[]]$ComposeArgs,
                  [Parameter(Mandatory)][string]$FailureMessage
              )
              $rawDiagnosticLines = @(
                  docker compose @ComposeArgs logs --no-color postgres kubo-a kubo-b kubo-c swarm-bootstrap cluster-a cluster-b gateway 2>&1
              )
              $diagnosticExit = $LASTEXITCODE
              foreach ($rawLine in $rawDiagnosticLines) {
                  [Console]::Out.WriteLine((Protect-ClusterDiagnosticLine -Line "$rawLine"))
              }
              if ($diagnosticExit -ne 0) { throw "$FailureMessage (exit=$diagnosticExit)" }
          }
          $compose = @("--project-name", $env:COMPOSE_PROJECT_NAME, "-f", "docker-compose.cluster.yml", "-f", "tests/compose.cluster-validation.yml")
          Write-SanitizedClusterDiagnostics -ComposeArgs $compose -FailureMessage "Pre-stop Cluster diagnostics failed"

      - name: Stop Cluster and Kubo peer B
        shell: pwsh
        run: |
          docker compose --project-name $env:COMPOSE_PROJECT_NAME -f docker-compose.cluster.yml -f tests/compose.cluster-validation.yml stop cluster-b kubo-b
          if ($LASTEXITCODE -ne 0) { throw "Peer B stop failed" }

      - name: Prove stopped peer loses two-pin evidence
        shell: pwsh
        run: |
          if ($env:CLUSTER_STATE_RECEIPT_OWNED -ne "true") { throw "Owned state receipt is required before outage validation" }
          cargo test --test cluster cluster_peer_b_outage_contract -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Peer B outage contract failed" }

      - name: Capture stopped-peer diagnostics before restart
        shell: pwsh
        run: |
          function Protect-ClusterDiagnosticLine {
              param([AllowEmptyString()][string]$Line)
              $safe = $Line
              $safe = [regex]::Replace($safe, '(Swarm key fingerprint: )[0-9a-f]{32}(?=\s*$)', '$1[redacted]')
              $safe = [regex]::Replace($safe, '(?m)^/key/swarm/psk/1\.0\.0/\s*$', '[REDACTED_SWARM_KEY_HEADER]')
              $safe = [regex]::Replace($safe, '(?m)^/base16/\s*$', '[REDACTED_SWARM_KEY_HEADER]')
              $safe = [regex]::Replace($safe, '(?<![0-9A-Fa-f])[0-9A-Fa-f]{64}(?![0-9A-Fa-f])', '[REDACTED_HEX]')
              $safe = [regex]::Replace(
                  $safe,
                  '(?i)((?:"?)(?:PeerID|peer_id|peer-id)(?:"?)\s*[:=]\s*)(?:"[^"]*"|''[^'']*''|[^\s,;]+)',
                  '$1[REDACTED_PEER_ID]'
              )
              $safe = [regex]::Replace(
                  $safe,
                  '(?i)(/p2p/)[1-9A-HJ-NP-Za-km-z]+',
                  '$1[REDACTED_PEER_ID]'
              )
              $safe = [regex]::Replace(
                  $safe,
                  '(?<![1-9A-HJ-NP-Za-km-z])12D3Koo[1-9A-HJ-NP-Za-km-z]{20,}(?![1-9A-HJ-NP-Za-km-z])',
                  '[REDACTED_PEER_ID]'
              )
              if ($safe -match '(?i)\b(?:peer(?:[_-]?id)?|peerid|identity|peerstore)\b') {
                  $safe = [regex]::Replace(
                      $safe,
                      '(?<![1-9A-HJ-NP-Za-km-z])Qm[1-9A-HJ-NP-Za-km-z]{44}(?![1-9A-HJ-NP-Za-km-z])',
                      '[REDACTED_PEER_ID]'
                  )
              }
              $safe
          }
          function Write-SanitizedClusterDiagnostics {
              param(
                  [Parameter(Mandatory)][string[]]$ComposeArgs,
                  [Parameter(Mandatory)][string]$FailureMessage
              )
              $rawDiagnosticLines = @(
                  docker compose @ComposeArgs logs --no-color postgres kubo-a kubo-b kubo-c swarm-bootstrap cluster-a cluster-b gateway 2>&1
              )
              $diagnosticExit = $LASTEXITCODE
              foreach ($rawLine in $rawDiagnosticLines) {
                  [Console]::Out.WriteLine((Protect-ClusterDiagnosticLine -Line "$rawLine"))
              }
              if ($diagnosticExit -ne 0) { throw "$FailureMessage (exit=$diagnosticExit)" }
          }
          $compose = @("--project-name", $env:COMPOSE_PROJECT_NAME, "-f", "docker-compose.cluster.yml", "-f", "tests/compose.cluster-validation.yml")
          Write-SanitizedClusterDiagnostics -ComposeArgs $compose -FailureMessage "Stopped-peer diagnostics failed"

      - name: Restart both Cluster peers and Kubo swarm with existing volumes
        shell: pwsh
        run: |
          function Wait-HealthyClusterService {
              param([Parameter(Mandatory)][string]$Service)
              $compose = @("--project-name", $env:COMPOSE_PROJECT_NAME, "-f", "docker-compose.cluster.yml", "-f", "tests/compose.cluster-validation.yml")
              $deadline = [DateTime]::UtcNow.AddSeconds(30)
              do {
                  $containerId = @(docker compose @compose ps -q $Service 2>&1)
                  $queryExit = $LASTEXITCODE
                  if ($queryExit -eq 0 -and $containerId.Count -eq 1 -and -not [string]::IsNullOrWhiteSpace("$($containerId[0])")) {
                      $health = @(docker inspect --format '{{.State.Health.Status}}' $containerId[0] 2>&1)
                      if ($LASTEXITCODE -eq 0 -and $health.Count -eq 1 -and "$($health[0])".Trim() -ceq "healthy") { return }
                  }
                  Start-Sleep -Milliseconds 500
              } while ([DateTime]::UtcNow -lt $deadline)
              throw "Cluster service did not become healthy within 30 seconds"
          }
          function Wait-CompletedSwarmBootstrap {
              $compose = @("--project-name", $env:COMPOSE_PROJECT_NAME, "-f", "docker-compose.cluster.yml", "-f", "tests/compose.cluster-validation.yml")
              $deadline = [DateTime]::UtcNow.AddSeconds(30)
              do {
                  $containerId = @(docker compose @compose ps --all -q swarm-bootstrap 2>&1)
                  $queryExit = $LASTEXITCODE
                  if ($queryExit -eq 0 -and $containerId.Count -eq 1 -and -not [string]::IsNullOrWhiteSpace("$($containerId[0])")) {
                      $state = @(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' $containerId[0] 2>&1)
                      if ($LASTEXITCODE -eq 0 -and $state.Count -eq 1 -and "$($state[0])".Trim() -ceq "exited 0") { return }
                  }
                  Start-Sleep -Milliseconds 500
              } while ([DateTime]::UtcNow -lt $deadline)
              throw "Swarm bootstrap did not complete with exact exited 0 within 30 seconds"
          }
          $compose = @("--project-name", $env:COMPOSE_PROJECT_NAME, "-f", "docker-compose.cluster.yml", "-f", "tests/compose.cluster-validation.yml")
          $stopAOutput = @(docker compose @compose stop cluster-a kubo-a 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Cluster A and Kubo A stop failed" }
          $startKuboOutput = @(docker compose @compose start kubo-a kubo-b 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Kubo A and Kubo B restart failed" }
          Wait-HealthyClusterService -Service kubo-a
          Wait-HealthyClusterService -Service kubo-b
          $bootstrapRestartOutput = @(docker compose @compose restart --timeout 30 swarm-bootstrap 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Swarm bootstrap restart failed" }
          Wait-CompletedSwarmBootstrap
          $startClusterOutput = @(docker compose @compose start cluster-a cluster-b 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Cluster A and Cluster B restart failed" }
          Wait-HealthyClusterService -Service cluster-a
          Wait-HealthyClusterService -Service cluster-b

      - name: Prove same-volume private swarm and peer B recovery
        shell: pwsh
        run: |
          if ($env:CLUSTER_STATE_RECEIPT_OWNED -ne "true") { throw "Owned state receipt is required before recovery validation" }
          cargo test --test cluster private_swarm_configuration_and_peering -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Private swarm post-restart configuration and peering contract failed" }
          cargo test --test cluster cluster_peer_b_restart_recovery -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Peer B same-volume recovery contract failed" }

      - name: Final sanitized Cluster diagnostics
        if: ${{ always() && env.CLUSTER_PINSET_ATTEMPTED == 'true' }}
        shell: pwsh
        run: |
          function Protect-ClusterDiagnosticLine {
              param([AllowEmptyString()][string]$Line)
              $safe = $Line
              $safe = [regex]::Replace($safe, '(Swarm key fingerprint: )[0-9a-f]{32}(?=\s*$)', '$1[redacted]')
              $safe = [regex]::Replace($safe, '(?m)^/key/swarm/psk/1\.0\.0/\s*$', '[REDACTED_SWARM_KEY_HEADER]')
              $safe = [regex]::Replace($safe, '(?m)^/base16/\s*$', '[REDACTED_SWARM_KEY_HEADER]')
              $safe = [regex]::Replace($safe, '(?<![0-9A-Fa-f])[0-9A-Fa-f]{64}(?![0-9A-Fa-f])', '[REDACTED_HEX]')
              $safe = [regex]::Replace(
                  $safe,
                  '(?i)((?:"?)(?:PeerID|peer_id|peer-id)(?:"?)\s*[:=]\s*)(?:"[^"]*"|''[^'']*''|[^\s,;]+)',
                  '$1[REDACTED_PEER_ID]'
              )
              $safe = [regex]::Replace(
                  $safe,
                  '(?i)(/p2p/)[1-9A-HJ-NP-Za-km-z]+',
                  '$1[REDACTED_PEER_ID]'
              )
              $safe = [regex]::Replace(
                  $safe,
                  '(?<![1-9A-HJ-NP-Za-km-z])12D3Koo[1-9A-HJ-NP-Za-km-z]{20,}(?![1-9A-HJ-NP-Za-km-z])',
                  '[REDACTED_PEER_ID]'
              )
              if ($safe -match '(?i)\b(?:peer(?:[_-]?id)?|peerid|identity|peerstore)\b') {
                  $safe = [regex]::Replace(
                      $safe,
                      '(?<![1-9A-HJ-NP-Za-km-z])Qm[1-9A-HJ-NP-Za-km-z]{44}(?![1-9A-HJ-NP-Za-km-z])',
                      '[REDACTED_PEER_ID]'
                  )
              }
              $safe
          }
          function Write-SanitizedClusterDiagnostics {
              param(
                  [Parameter(Mandatory)][string[]]$ComposeArgs,
                  [Parameter(Mandatory)][string]$FailureMessage
              )
              $rawDiagnosticLines = @(
                  docker compose @ComposeArgs logs --no-color postgres kubo-a kubo-b kubo-c swarm-bootstrap cluster-a cluster-b gateway 2>&1
              )
              $diagnosticExit = $LASTEXITCODE
              foreach ($rawLine in $rawDiagnosticLines) {
                  [Console]::Out.WriteLine((Protect-ClusterDiagnosticLine -Line "$rawLine"))
              }
              if ($diagnosticExit -ne 0) { throw "$FailureMessage (exit=$diagnosticExit)" }
          }
          $compose = @("--project-name", $env:COMPOSE_PROJECT_NAME, "-f", "docker-compose.cluster.yml", "-f", "tests/compose.cluster-validation.yml")
          Write-SanitizedClusterDiagnostics -ComposeArgs $compose -FailureMessage "Final Cluster diagnostics failed"

      - name: Cluster cleanup and residual assertion
        if: ${{ always() }}
        shell: pwsh
        run: |
          $project = $env:COMPOSE_PROJECT_NAME
          $errors = [Collections.Generic.List[string]]::new()
          $topologyOwned = $env:CLUSTER_PINSET_OWNED -eq "true" -and $env:CLUSTER_PINSET_ATTEMPTED -eq "true"
          $proofsAttempted = $env:CLUSTER_PRIVATE_SWARM_PROOFS_ATTEMPTED -eq "true"
          $fileMarkersPresent = $env:CLUSTER_SWARM_KEY_OWNED -eq "true" -or
              $env:CLUSTER_SWARM_KEY_WRONG_OWNED -eq "true" -or
              $env:CLUSTER_STATE_RECEIPT_OWNED -eq "true"
          if (-not $topologyOwned -and -not $proofsAttempted -and -not $fileMarkersPresent) {
              Write-Host "No owned Cluster topology, proof, or receipt requires cleanup"
              exit 0
          }
          if ($proofsAttempted) {
              $proofContainers = @(docker ps --all --quiet --filter "label=com.docker.compose.project=$project" --filter "label=ipfs3.cluster.private-swarm-proof" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              $proofQueryExit = $LASTEXITCODE
              if ($proofQueryExit -ne 0) {
                  $errors.Add("proof residual query exited $proofQueryExit")
              } else {
                  foreach ($proofContainer in $proofContainers) {
                      $proofProjectLabel = @(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' $proofContainer 2>&1)
                      $proofProjectLabelExit = $LASTEXITCODE
                      $proofLabel = @(docker inspect --format '{{ index .Config.Labels "ipfs3.cluster.private-swarm-proof" }}' $proofContainer 2>&1)
                      $proofLabelExit = $LASTEXITCODE
                      if ($proofProjectLabelExit -ne 0 -or $proofLabelExit -ne 0 -or $proofProjectLabel.Count -ne 1 -or $proofLabel.Count -ne 1 -or "$($proofProjectLabel[0])".Trim() -cne $project -or "$($proofLabel[0])".Trim() -notin @("normal", "handled", "unhandled")) {
                          $errors.Add("proof container ownership label check failed")
                          continue
                      }
                      $proofRunning = @(docker inspect --format '{{.State.Running}}' $proofContainer 2>&1)
                      if ($LASTEXITCODE -ne 0 -or $proofRunning.Count -ne 1) {
                          $errors.Add("proof container running-state query failed")
                          continue
                      }
                      if ("$($proofRunning[0])".Trim() -ceq "true") {
                          $proofStopOutput = @(docker stop --time 30 $proofContainer 2>&1)
                          if ($LASTEXITCODE -ne 0) { $errors.Add("proof container stop failed") }
                      }
                      $proofRemoveOutput = @(docker rm $proofContainer 2>&1)
                      if ($LASTEXITCODE -ne 0) { $errors.Add("proof container removal failed") }
                  }
              }
              $proofResidual = @(docker ps --all --quiet --filter "label=com.docker.compose.project=$project" --filter "label=ipfs3.cluster.private-swarm-proof" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              $proofResidualExit = $LASTEXITCODE
              if ($proofResidualExit -ne 0) { $errors.Add("proof residual assertion query exited $proofResidualExit") }
              if ($proofResidual.Count -ne 0) { $errors.Add("proof container residue remains") }
          }
          if ($topologyOwned) {
              docker compose --profile private-swarm-validation --project-name $project -f docker-compose.cluster.yml -f tests/compose.cluster-validation.yml down --volumes --remove-orphans
              $downExit = $LASTEXITCODE
              if ($downExit -ne 0) { $errors.Add("down exited $downExit") }
              $containers = @(docker ps --all --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              $containerExit = $LASTEXITCODE
              $networks = @(docker network ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              $networkExit = $LASTEXITCODE
              $volumes = @(docker volume ls --quiet --filter "label=com.docker.compose.project=$project" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              $volumeExit = $LASTEXITCODE
              if ($containerExit -ne 0) { $errors.Add("container residual query exited $containerExit") }
              if ($networkExit -ne 0) { $errors.Add("network residual query exited $networkExit") }
               if ($volumeExit -ne 0) { $errors.Add("volume residual query exited $volumeExit") }
               if (($containers.Count + $networks.Count + $volumes.Count) -ne 0) { $errors.Add("project-labelled residual resources remain") }
           }
           foreach ($ownedFile in @(
               [pscustomobject]@{ Marker = "CLUSTER_SWARM_KEY_OWNED"; Path = $env:IPFS_S3_SWARM_KEY_FILE; Label = "owned main swarm key" },
               [pscustomobject]@{ Marker = "CLUSTER_SWARM_KEY_WRONG_OWNED"; Path = $env:IPFS_S3_SWARM_KEY_WRONG_FILE; Label = "owned wrong swarm key" },
               [pscustomobject]@{ Marker = "CLUSTER_STATE_RECEIPT_OWNED"; Path = $env:IPFS_S3_CLUSTER_STATE_PATH; Label = "owned state receipt" }
           )) {
               if ([Environment]::GetEnvironmentVariable($ownedFile.Marker, "Process") -ne "true") { continue }
               try {
                   if (-not (Test-Path -LiteralPath $ownedFile.Path -PathType Leaf)) {
                       throw "$($ownedFile.Label) is missing before cleanup"
                   }
                   Remove-Item -LiteralPath $ownedFile.Path -ErrorAction Stop
                   if (Test-Path -LiteralPath $ownedFile.Path) { throw "$($ownedFile.Label) remains" }
               } catch {
                   $errors.Add("$($ownedFile.Label) cleanup failed: $($_.Exception.Message)")
               }
           }
           if ($errors.Count -ne 0) { throw ($errors -join "; ") }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Docker Compose
        run: docker compose version

      - name: Build and start Kubo and gateway
        run: docker compose -f docker-compose.yml up --detach --build --wait --wait-timeout 300 kubo gateway

      - name: Run serial end-to-end tests
        run: cargo test --test e2e -- --nocapture --test-threads=1

      - name: Compose diagnostics
        if: ${{ always() }}
        continue-on-error: true
        run: docker compose -f docker-compose.yml logs --no-color kubo gateway

      - name: Compose cleanup
        if: ${{ always() }}
        continue-on-error: true
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans

  client-smoke-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Test release-validation workflow contract
        run: pwsh -NoProfile -File tests/release-validation.Tests.ps1

      - name: Test PostgreSQL production baseline contract
        run: pwsh -NoProfile -File tests/postgres-production-baseline.Tests.ps1

      - name: Test multi-gateway deployment contract
        run: pwsh -NoProfile -File tests/multi-gateway.Tests.ps1

      - name: Test Cluster pinset replication contract
        run: pwsh -NoProfile -File tests/cluster.Tests.ps1

      - name: Test client-smoke infrastructure
        run: pwsh -NoProfile -File tests/client-smoke.Tests.ps1
