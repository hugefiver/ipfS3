name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Gateway lifecycle and readiness tests
        run: cargo test --bin ipfs-s3-gateway

      - name: Integration tests
        run: cargo test --test integration

      - name: Lightweight security regressions
        run: |
          cargo test --test http_admission
          cargo test --test object_read_snapshot
          cargo test --test bucket_config_owner_atomicity

      - name: Native runner isolation tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/native-runner.Tests.ps1

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
