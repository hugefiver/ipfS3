worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format gateway '$request_method $uri status=$status request_time=$request_time upstream_status=$upstream_status';
    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log warn;

    # S3 PUT/COPY and DELETE can create versions/delete markers. HTTP's generic
    # idempotency classification is not sufficient to make their replay safe.
    map $request_method $gateway_safe_read {
        default 0;
        GET 1;
        HEAD 1;
    }

    upstream ipfs3_gateways {
        server gateway-a:9000 max_fails=1 fail_timeout=10s;
        server gateway-b:9000 max_fails=1 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 9000;
        server_name _;
        client_max_body_size 0;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # Fail closed for every method except GET/HEAD, including empty writes.
        proxy_next_upstream off;

        location = /health {
            error_page 418 = @health_read;
            if ($gateway_safe_read) { return 418; }
            proxy_pass http://ipfs3_gateways/ready;
        }

        location @health_read {
            rewrite ^ /ready break;
            proxy_pass http://ipfs3_gateways;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location / {
            # A named location preserves the original method and escaped URI,
            # unlike an error_page URI redirect (important for SigV4).
            error_page 418 = @safe_read;
            if ($gateway_safe_read) { return 418; }
            proxy_pass http://ipfs3_gateways;
        }

        location @safe_read {
            proxy_pass http://ipfs3_gateways;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
