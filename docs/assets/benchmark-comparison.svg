  <!-- Footer -->
  <text class="footer" x="28" y="647">All 8 scenarios completed with 0 errors. ipfS3 4 MiB SSE-S3 (AES-256-GCM): 93.2 MiB/s PUT (-45%) · 414.8 MiB/s GET (-16%). Gateway RSS: 46.5 MiB.</text>
