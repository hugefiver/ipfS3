<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 664" width="960" height="664" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">S3 Benchmark Comparison: ipfS3 (PG18 + Kubo) vs MinIO vs RustFS</title>
  <desc id="chart-desc">Grouped horizontal bar charts comparing ipfS3 with PostgreSQL 18 and Kubo against MinIO and RustFS across 8 warp S3 benchmark scenarios.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .track { fill: #e2e8f0; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
      .legend { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #334155; }
      .panel-title { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .panel-meta { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
      .row-label { font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
      .row-label-main { font: 700 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0369a1; }
      .val { font: 600 11.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #334155; }
      .val-main { font: 700 11.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #0369a1; }
      .footer { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
      .bar-ipfs3 { fill: #0ea5e9; }
      .bar-minio { fill: #f97316; }
      .bar-rustfs { fill: #10b981; }
    </style>
  </defs>

  <!-- Outer Card -->
  <rect class="bg" x="1" y="1" width="958" height="662" rx="12"/>

  <!-- Header -->
  <text class="title" x="28" y="36">S3 Benchmark: ipfS3 (PG18 + Kubo) vs MinIO vs RustFS</text>
  <text class="subtitle" x="28" y="56">Single-host Docker bridge · minio/warp 1.3.1 · Plaintext HTTP · Higher is better (each panel scaled to its max)</text>

  <!-- Legend -->
  <rect class="bar-ipfs3" x="28" y="68" width="12" height="12" rx="3"/>
  <text class="legend" x="46" y="78">ipfS3 + PostgreSQL 18 + Kubo 0.43.2</text>

  <rect class="bar-minio" x="296" y="68" width="12" height="12" rx="3"/>
  <text class="legend" x="314" y="78">MinIO (2026-11-23)</text>

  <rect class="bar-rustfs" x="470" y="68" width="12" height="12" rx="3"/>
  <text class="legend" x="488" y="78">RustFS (1.0.7)</text>

  <line x1="28" y1="90" x2="932" y2="90" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 0, Col 0: 01 PUT 64 KiB -->
  <g transform="translate(28, 104)">
    <rect class="panel" x="0" y="0" width="442" height="120" rx="8"/>
    <text class="panel-title" x="14" y="23">01 · PUT 64 KiB</text>
    <text class="panel-meta" x="428" y="23" text-anchor="end">C=16 · obj/s</text>

