[server]
bind = "0.0.0.0:9000"

[kubo]
rpc_url = "http://127.0.0.1:5001"

# Optional independent cold Kubo for lifecycle STANDARD -> STANDARD_IA.
# Disabled when this section and IPFS_S3_COLD_KUBO_RPC_URL are absent.
# Use a different node identity and repository/volume, never a hot replica or
# pinning provider. Keep its RPC private; all gateways must share tier bindings.
# [cold_kubo]
# rpc_url = "http://cold:5001"

[storage]
database_url = "sqlite:///data/ipfs-s3.db?mode=rwc"

[[auth.credentials]]
access_key = "test"
secret_key = "test"

[crypto]
# Generate with: openssl rand -hex 32
# WARNING: Do NOT use all-zeros in production. The gateway will refuse to
#          start with an all-zero key in release builds.
master_key = "a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90"

[imports]
# CID imports are enabled by default. URL imports require exact HTTPS origins.
enabled = true
allowed_https_origins = []
worker_concurrency = 4
poll_interval_ms = 500
lease_duration_secs = 60
progress_flush_interval_ms = 1000
connect_timeout_secs = 10
idle_timeout_secs = 120
job_timeout_secs = 86400
max_download_bytes = 5368709120
max_attempts = 5
terminal_retention_secs = 604800
max_provider_records = 20

[decompress_zip]
# ZIP-only default. A signed ipfs-s3:zip-root=true|false object tag overrides
# this setting per ZIP request; ordinary PUT/Copy/tagging does not build a root.
unixfs_directory_root = true
# Optional per-input ZIP limits: 16 GiB raw source ZIP bytes (including ZIP
# framing), 8 GiB decompressed total and per entry, 10,000 entries, 64 MiB
# metadata; no overall processing deadline. The new raw-source intake boundary
# (Stage 4 pending verification across all entry points) rejects ZIPs above
# 16 GiB, including padding, unless raised (at most 64 GiB). These are
# per-input limits, NOT a guarantee of global Kubo physical disk capacity.
# max_staged_adds counts attempted per-entry Kubo adds, NOT Kubo disk usage or
# retained CIDs. Raw byte enforcement requires each intake path to wrap its
# actual incoming stream; a source Content-Length is not proof of bytes read.
# max_archive_bytes = 17179869184
# max_decompressed_bytes = 8589934592
# max_single_entry_bytes = 8589934592
# max_entries = 10000
# max_metadata_bytes = 67108864
# max_staged_adds = 10000
# processing_deadline_secs = 3600  # Optional overall extraction duration, not idle timeout.

[lifecycle]
poll_interval_ms = 1000
scan_page_size = 500
scan_lease_secs = 30
action_lease_secs = 30
worker_concurrency = 4
max_attempts = 8
base_backoff_secs = 1
max_backoff_secs = 60

[pinning]
worker_interval = "5s"
worker_concurrency = 4

# Optional pin controls fail strictly when this section is omitted (including
# existing deployments). Explicitly opt in only if a skipped manual pin request
# with a response warning is acceptable. Authentication, malformed tags, primary
# writes, and automatic pinning policy are not made optional by this setting.
# This example keeps the automatic `always` policy below: warn does not turn it
# into a best-effort subset of the configured providers.
[pinning_control]
unavailable = "warn"

# Provider tokens are read from the named environment variables. Never put a
# token in this file. Built-in public endpoints are used by default; endpoint
# overrides are only for tests or private compatible services.
[[pinning.providers]]
name = "pinata-primary"
kind = "pinata"
token_env = "PINATA_JWT"
# Pinata options:
# - api = "v3" uses Pinata's current Resource/Upload APIs.
# - api = "legacy" uses pinByHash/pinFileToIPFS.
# - strategy = "cid" asks Pinata to pin an existing CID.
# - strategy = "upload" reads the object from local Kubo and uploads the bytes
#   to Pinata; this can work on free plans that reject pin-by-CID.
api = "v3"
strategy = "cid"
priority = 10
max_bytes = 107374182400
max_pins = 10000

[[pinning.providers]]
name = "filebase-primary"
kind = "filebase"
# Omitted api remains historical PSA/cid, NOT RPC. Explicit api = "psa" and
# strategy = "cid" are also accepted; PSA/upload is rejected.
token_env = "FILEBASE_PINNING_TOKEN"
priority = 20
max_bytes = 107374182400
max_pins = 10000

# Stable runtime identities are separate from routing aliases (`name`). New
# accepted MPU/import with executable remote intent requires an explicit entry
# for every executable configured non-Noop provider; legacy name-only async work
# is refused.
# Noop or no executable intent does not require these entries. Historical jobs
# keep their captured routes. Revisions are administrator-managed and must
# increase when the referenced credential or endpoint changes; a change before
# accepted MPU completion fails closed, before side effects. Snapshots persist
# only secret references such as env names, never secret values or hashes.
#
# `storage_domain` is the physical/account pin domain. A provider whose domain
# equals `primary_storage_domain` is rejected because it is not an independent
# backup. Aliases for the same backend + scope intentionally share canonical
# resource accounting. New explicit identities default to cleanup = "retain";
# set cleanup = "managed" only for an exclusive, operationally verified scope.
[pinning_identity]
primary_storage_domain = "kubo:primary"

[[pinning_identity.providers]]
config_name = "pinata-primary"
provider_id = "pinata-prod"
display_name = "Primary Pinata"
backend = "pinata"
scope = "account:pinata-prod"
storage_domain = "pinata:pinata-prod"
credential_revision = 1
endpoint_revision = 1
secret_ref = "env:PINATA_JWT"
api_profile = "pinata-v3"
strategy = "cid"
retired = false
cleanup = "retain"

[[pinning_identity.providers]]
config_name = "filebase-primary"
provider_id = "filebase-prod"
display_name = "Primary Filebase"
backend = "filebase"
scope = "account:filebase-prod"
storage_domain = "filebase:filebase-prod"
credential_revision = 1
endpoint_revision = 1
secret_ref = "env:FILEBASE_PINNING_TOKEN"
api_profile = "filebase-psa"
strategy = "cid"
retired = false
cleanup = "retain"

# Policies are evaluated in file order. The first exact-bucket (or "*") and
# literal-prefix match wins.
[[pinning.policies]]
bucket = "*"
prefix = ""
trigger = "always"
provider_mode = "all"
providers = ["pinata-primary", "filebase-primary"]
default_duration = "30d"
max_duration = "365d"
allow_decompressed = true

# Stage 5 opt-in RPC examples. All lines below are commented out, so the existing
# PSA/Pinata routes and policy above are unchanged. Enable each provider/options/
# identity triple together and explicitly select its name in a policy. Reuse the
# existing [pinning_identity] table; don't create a second identity registry.
# RPC requires an explicit identity, positive revisions and an independent domain.
# Scope/backend are administrator assertions, not inferred from endpoint/token.
# Bump credential_revision for password/token/Basic username changes and
# endpoint_revision for endpoint changes. Another account/pinset needs a new scope.
# cleanup defaults to retain. An add/import/recursive pin/matching CID does NOT
# establish ApplicationCreated ownership, even if cleanup is set to managed.
# Stop/drain all old writers/workers and back up before the RPC ledger migration;
# mixed versions and dangerous down/table deletion are unsupported.
# Stage 5 verification is running; this example isn't a PASS or account receipt.

# Independent private Kubo: cid, upload or car (explicit strategy required).
# cid needs target access to the DAG; upload uses stored bytes, not S3 plaintext.
# Directories require complete single-root CAR, not cat(root) byte upload.
# [[pinning.providers]]
# name = "kubo-backup"
# kind = "ipfs_rpc"
# api = "rpc"
# strategy = "car"
# endpoint = "http://127.0.0.1:5002"
# priority = 30
# max_bytes = 107374182400
# max_pins = 10000
#
# [[pinning_rpc.providers]]
# config_name = "kubo-backup" # joins pinning.providers.name
# profile = "kubo"
# auth = "none" # omit token_env, username_env and identity secret_ref
# allow_private_network = true # explicit authorization for this private target
# connect_timeout_seconds = 30
# control_timeout_seconds = 300
# idle_timeout_seconds = 120
#
# [[pinning_identity.providers]]
# config_name = "kubo-backup"
# provider_id = "kubo-backup-prod"
# display_name = "Independent Kubo backup"
# backend = "kubo" # kind is ipfs_rpc, identity backend is kubo
# scope = "node:backup"
# storage_domain = "kubo:backup"
# credential_revision = 1
# endpoint_revision = 1
# api_profile = "kubo"
# strategy = "car"
# cleanup = "retain"
#
# Kubo Bearer alternative: set auth = "bearer" in its RPC entry, add
# token_env = "KUBO_BACKUP_TOKEN" to its provider, and add
# secret_ref = "env:KUBO_BACKUP_TOKEN" to its identity.
# Kubo Basic alternative: set auth = "basic" and
# username_env = "KUBO_BACKUP_USERNAME" in the RPC entry; add
# token_env = "KUBO_BACKUP_PASSWORD" to its provider and
# secret_ref = "env:KUBO_BACKUP_PASSWORD" to its identity.
# These are environment variable NAMES only, not secret values. Provision them
# outside TOML; references accept uppercase letters, digits and underscores.
# Never reuse source-node credentials or forward RPC credentials to a gateway.

# Filebase RPC: upload only, Bearer only. This does not replace filebase-primary's
# historical PSA route. Real Filebase/Pinata account tests remain NOT RUN.
# [[pinning.providers]]
# name = "filebase-rpc-backup"
# kind = "filebase"
# api = "rpc"
# strategy = "upload"
# endpoint = "https://rpc.filebase.io" # also the default for this route
# token_env = "FILEBASE_RPC_TOKEN"
# priority = 40
# max_bytes = 107374182400
# max_pins = 10000
#
# [[pinning_rpc.providers]]
# config_name = "filebase-rpc-backup"
# profile = "filebase"
# auth = "bearer"
# allow_private_network = false
#
# [[pinning_identity.providers]]
# config_name = "filebase-rpc-backup"
# provider_id = "filebase-rpc-prod"
# display_name = "Filebase RPC backup"
# backend = "filebase"
# scope = "bucket:backup"
# storage_domain = "filebase:backup"
# credential_revision = 1
# endpoint_revision = 1
# secret_ref = "env:FILEBASE_RPC_TOKEN"
# api_profile = "filebase-rpc"
# strategy = "upload"
# cleanup = "retain"
#
# Public RPC requires HTTPS/public resolved addresses; private networking defaults
# to denied. No endpoint may contain userinfo/query/fragment. Redirects aren't
# followed and don't forward credentials. Certificate verification remains on.
# Unsupported and explicitly rejected: tls_ca_pem, tls_client_cert_pem,
# tls_client_key_pem, tls_insecure = true. Don't add these as working TLS options.
# Filebase sends official cid-version/wrap-with-directory parameters only, not
# raw-leaves/chunker/pin=false/progress=true, and never appends pin/add after add.
# Filebase RPC cid/CAR and PSA upload are rejected; no automatic fallback.
# Codec + multihash must match (equivalent CIDv0/v1 is allowed). S3 ETag/CID stays
# unchanged. Unknown/mismatch footprints remain durable and block automatic
# re-POST/deletion; timeout/terminal job/lease expiry doesn't release that debt.
